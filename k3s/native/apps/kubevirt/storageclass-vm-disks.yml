# StorageClass для дисков ВМ на большом диске /DATA (555G свободно).
#
# Обычный local-path кладёт тома на root / (мало места). Этот SC через nodePath
# перенаправляет тома ВМ в /DATA/vm-disks, а pathPattern даёт предсказуемый путь:
#   /DATA/vm-disks/<namespace>/<pvc-name>/
# Напр. системный диск ubuntu-vm ляжет в:
#   /DATA/vm-disks/vms/ubuntu-vm-rootdisk/
#
# Требует, чтобы папка существовала на ноде: mkdir -m 0777 -p /DATA/vm-disks
#
# Применение:
#   kubectl --context home-k3s apply -f k3s/native/apps/kubevirt/storageclass-vm-disks.yml
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vm-disks
provisioner: rancher.io/local-path
parameters:
  nodePath: /DATA/vm-disks
  pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
