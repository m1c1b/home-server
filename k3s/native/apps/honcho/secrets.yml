---
# -----------------------------------------------------------------------------
# Секреты Honcho:
#   LLM_OPENAI_API_KEY — ключ omniroute (Honcho -> omniroute, Bearer на /v1).
#   AUTH_JWT_SECRET    — серверный секрет подписи JWT (HS256, 32 байта hex).
#                        Им Honcho подписывает и проверяет клиентские токены.
#                        Сам секрет НЕ отправляется клиентам; клиентам выдаётся
#                        JWT, сгенерированный scripts/generate_jwt.py (см. api.yml).
# -----------------------------------------------------------------------------
#apiVersion: v1
#kind: Secret
#metadata:
#  name: honcho-secrets
#  namespace: honcho
#type: Opaque
#stringData:
#  LLM_OPENAI_API_KEY: ''
#  AUTH_JWT_SECRET: ''
