---
# HTTPRoute для Honcho API (внутренний хост; при необходимости добавить внешний tuna).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: honcho
  namespace: honcho
spec:
  parentRefs:
    - name: main-gateway
      namespace: nginx-gateway
  hostnames:
    - "honcho.m1c1b.home"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: honcho-api
          port: 80
